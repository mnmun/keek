[package]
name = "keek"
description = "interactive tui for the lazy_json parser"
version = "0.0.0"
authors = ["mnmun <mnmnmun@proton.me>"]
homepage = "https://github.com/mnmun/keek"
repository = "https://github.com/mnmun/keek"
readme = "README.md"
exclude = ["flake.nix", "flake.lock"]
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
getset = "0.1.6"
lazy_json = "1.0.0"
nestify = "0.3.3"
ratwrap = "1.0.1"
ratwrap-macros = "1.0.1"
tokio = { version = "1.39.3", features = ["full"] }
tokio-util = "0.7.16"

[dev-dependencies]
pretty_assertions = "1.4.1"

